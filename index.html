<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><title>VYRON Mobile V1</title><link rel="manifest" href="manifest.json"><style>*{box-sizing:border-box}body{margin:0;background:#070b16;color:#f5f7ff;font-family:Arial,sans-serif}.app{min-height:100vh;max-width:520px;margin:auto;display:flex;flex-direction:column}header{padding:22px 20px 14px;text-align:center;border-bottom:1px solid #20283d}.logo{font-size:32px;font-weight:800;letter-spacing:5px;background:linear-gradient(90deg,#2f7cff,#b56cff);-webkit-background-clip:text;color:transparent}.sub{font-size:12px;color:#9ba7c0;margin-top:5px}.status{margin:18px 20px 10px;padding:12px 14px;border:1px solid #29334e;border-radius:14px;background:#10162a;color:#aeb9d1;font-size:13px}.chat{flex:1;padding:8px 16px 110px;overflow:auto}.msg{max-width:86%;padding:12px 14px;border-radius:16px;margin:10px 0;line-height:1.45;font-size:14px;white-space:pre-wrap}.user{margin-left:auto;background:#245eea}.vyron{background:#171e31;border:1px solid #29334e}.controls{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);padding:12px 14px 18px;background:linear-gradient(transparent,#070b16 18% 100%)}.row{display:flex;gap:8px}.row input{flex:1;background:#11182a;border:1px solid #303b58;color:white;border-radius:14px;padding:13px}button{border:0;border-radius:14px;padding:12px 14px;background:#285fe8;color:#fff;font-weight:700}button.secondary{background:#202941}.mic{width:52px;font-size:20px}.quick{display:flex;gap:7px;margin-top:8px;overflow:auto}.quick button{white-space:nowrap;font-size:11px;padding:8px 10px}.listening{box-shadow:0 0 0 3px #9d5cff66;animation:pulse 1s infinite}@keyframes pulse{50%{box-shadow:0 0 0 7px #9d5cff22}}</style></head><body><div class="app"><header><div class="logo">VYRON</div><div class="sub">YOUR PERSONAL AI ASSISTANT • MOBILE V1</div></header><div id="status" class="status">Ready. Tap the microphone and speak.</div><main id="chat" class="chat"><div class="msg vyron">Hello Varun. I am VYRON. 👋<br>Voice commands are ready. Try: “What time is it?” or “Open Google”.</div></main><div class="controls"><div class="row"><input id="input" placeholder="Ask VYRON anything…"><button id="send">Send</button><button id="mic" class="mic secondary">🎙️</button></div><div class="quick"><button data-cmd="What time is it?">Time</button><button data-cmd="Tell me today's date">Date</button><button data-cmd="Open Google">Google</button><button data-cmd="Open YouTube">YouTube</button><button data-cmd="Hello VYRON">Hello</button></div></div></div><script>const chat=document.getElementById('chat'),input=document.getElementById('input'),status=document.getElementById('status'),mic=document.getElementById('mic');function add(text,who){const d=document.createElement('div');d.className='msg '+who;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}function speak(text){if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-IN';speechSynthesis.speak(u)}}function answer(q){const x=q.toLowerCase().trim();if(x.includes('time'))return`The current time is ${new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}.`;if(x.includes('date')||x.includes('today'))return`Today is ${new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}.`;if(x.includes('hello')||x.includes('hi'))return'Hello Varun. VYRON is online. How can I help?';if(x.includes('open google')){window.open('https://www.google.com','_blank');return'Opening Google.'}if(x.includes('open youtube')){window.open('https://www.youtube.com','_blank');return'Opening YouTube.'}return`I understood: “${q}”. The AI brain connection is the next upgrade. This V1 currently handles local commands and voice.`}function run(q){if(!q.trim())return;add(q,'user');input.value='';status.textContent='VYRON is thinking…';setTimeout(()=>{const a=answer(q);add(a,'vyron');speak(a);status.textContent='Ready.'},250)}document.getElementById('send').onclick=()=>run(input.value);input.addEventListener('keydown',e=>{if(e.key==='Enter')run(input.value)});document.querySelectorAll('.quick button').forEach(b=>b.onclick=()=>run(b.dataset.cmd));const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){const rec=new SR();rec.lang='en-IN';rec.interimResults=false;rec.onstart=()=>{mic.classList.add('listening');status.textContent='Listening…'};rec.onend=()=>{mic.classList.remove('listening');status.textContent='Ready.'};rec.onerror=()=>{mic.classList.remove('listening');status.textContent='Voice input unavailable. Check microphone permission.'};rec.onresult=e=>run(e.results[0][0].transcript);mic.onclick=()=>rec.start()}else{mic.disabled=true;status.textContent='Voice recognition is not supported in this browser.'}if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});</script></body></html>
