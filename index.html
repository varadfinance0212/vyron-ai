<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#07111f">
<meta name="description" content="VYRON - Your Personal AI Assistant">

<title>VYRON AI Assistant</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at top,#17385c 0%,#07111f 42%,#02060c 100%);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.app{
  width:100%;
  max-width:520px;
  min-height:650px;
  background:rgba(8,18,32,.92);
  border:1px solid rgba(255,255,255,.12);
  border-radius:28px;
  padding:24px;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
  backdrop-filter:blur(15px);
}

.logo{
  width:78px;
  height:78px;
  margin:5px auto 14px;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:30px;
  font-weight:bold;
  background:linear-gradient(145deg,#1e90ff,#6c5ce7);
  box-shadow:0 0 35px rgba(30,144,255,.35);
}

h1{
  text-align:center;
  font-size:32px;
  letter-spacing:4px;
}

.subtitle{
  text-align:center;
  color:#9fb3c8;
  font-size:12px;
  margin-top:6px;
  letter-spacing:1px;
}

.status{
  margin:22px 0 15px;
  padding:12px;
  border-radius:14px;
  text-align:center;
  background:rgba(255,255,255,.06);
  color:#8fd3ff;
  font-size:13px;
}

.language-box{
  margin-bottom:15px;
}

.language-box label{
  display:block;
  color:#aabbd0;
  font-size:12px;
  margin-bottom:7px;
}

select,input{
  width:100%;
  border:none;
  outline:none;
  border-radius:14px;
  padding:14px;
  background:#101f33;
  color:white;
  font-size:15px;
  border:1px solid rgba(255,255,255,.1);
}

.chat{
  min-height:160px;
  max-height:250px;
  overflow-y:auto;
  padding:15px;
  margin-bottom:15px;
  border-radius:18px;
  background:rgba(255,255,255,.04);
}

.message{
  margin-bottom:12px;
  padding:11px 13px;
  border-radius:14px;
  line-height:1.5;
  font-size:14px;
}

.vyron{
  background:rgba(30,144,255,.12);
  border-left:3px solid #1e90ff;
}

.user{
  background:rgba(255,255,255,.07);
  border-right:3px solid #6c5ce7;
  text-align:right;
}

.input-row{
  display:flex;
  gap:8px;
  margin-bottom:12px;
}

.input-row input{
  flex:1;
}

button{
  border:none;
  cursor:pointer;
  color:white;
  background:#172940;
  border-radius:14px;
  padding:13px 16px;
  font-size:14px;
  font-weight:bold;
}

button:active{
  transform:scale(.97);
}

.send{
  background:linear-gradient(135deg,#1976d2,#6254e7);
}

.mic{
  width:58px;
  height:50px;
  font-size:22px;
  background:linear-gradient(135deg,#0e7490,#2563eb);
}

.mic.listening{
  background:#e11d48;
  animation:pulse 1s infinite;
}

@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(225,29,72,.6);}
  70%{box-shadow:0 0 0 15px rgba(225,29,72,0);}
  100%{box-shadow:0 0 0 0 rgba(225,29,72,0);}
}

.quick{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:10px;
}

.quick button{
  font-size:12px;
  padding:11px 5px;
}

.footer{
  text-align:center;
  color:#62758b;
  font-size:10px;
  margin-top:18px;
}

@media(max-width:400px){
  .app{
    padding:18px;
  }

  h1{
    font-size:28px;
  }
}
</style>
</head>

<body>

<div class="app">

    Ready. Tap the microphone and speak.

    <select id="language">

      <option value="hi-IN">🇮🇳 Hindi</option>
      <option value="gu-IN">🇮🇳 Gujarati</option>
    </select>
  </div>

  <div id="chat" class="chat">

      Hello Varun. I am VYRON. 👋
    </div>
  </div>

  <div class="input-row">

    <input
      id="textInput"

    >

    <button id="send" class="send">
      Send
    </button>

    <button id="mic" class="mic">

      🔎 Google
    </button>
